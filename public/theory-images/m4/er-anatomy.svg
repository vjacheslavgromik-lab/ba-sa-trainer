<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Анатомия ER-диаграммы</title><desc id="d">Две сущности Клиент и Заказ, соединённые связью «делает»; подписаны сущность, атрибуты, ключ, связь и кратность.</desc><rect width="760" height="330" fill="#ffffff"/><rect x="70" y="110" width="180" height="101" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><rect x="70" y="110" width="180" height="30" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="160.0" y="130" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Клиент</text><text x="80" y="155" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">id  (PK)</text><text x="80" y="176" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">имя</text><text x="80" y="197" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">email</text><rect x="510" y="110" width="180" height="101" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><rect x="510" y="110" width="180" height="30" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="600.0" y="130" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Заказ</text><text x="520" y="155" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">id  (PK)</text><text x="520" y="176" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">customer_id  (FK)</text><text x="520" y="197" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">дата</text><line x1="250" y1="165" x2="510" y2="165" stroke="#334155" stroke-width="1.6"/><line x1="261" y1="157" x2="261" y2="173" stroke="#334155" stroke-width="1.6"/><line x1="268" y1="157" x2="268" y2="173" stroke="#334155" stroke-width="1.6"/><line x1="494" y1="165" x2="510" y2="174" stroke="#334155" stroke-width="1.6"/><line x1="494" y1="165" x2="510" y2="165" stroke="#334155" stroke-width="1.6"/><line x1="494" y1="165" x2="510" y2="156" stroke="#334155" stroke-width="1.6"/><circle cx="483" cy="165" r="5" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="380" y="155" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1d4ed8">делает</text><text x="160" y="36" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">Сущность — прямоугольник</text><text x="160" y="53" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">с именем и атрибутами</text><line x1="160" y1="60" x2="160" y2="110" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="36" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">Связь — линия</text><text x="380" y="53" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">с именем-глаголом</text><line x1="380" y1="60" x2="380" y2="140" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><text x="600" y="36" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">Атрибуты; PK — первичный,</text><text x="600" y="53" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">FK — внешний ключ</text><line x1="600" y1="60" x2="600" y2="110" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="250" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">Кратность читается у ближнего конца линии:</text><text x="380" y="268" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">у заказа ровно один клиент (две черты), у клиента заказов может быть ноль или много (кружок и «лапка»)</text><line x1="262" y1="238" x2="262" y2="178" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="498" y1="238" x2="498" y2="178" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="308" font-size="12" font-weight="normal" font-style="italic" text-anchor="middle" fill="#334155">Нотация «воронья лапка»</text></svg>
