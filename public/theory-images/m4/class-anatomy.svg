<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Класс на диаграмме UML</title><desc id="d">Прямоугольник класса «Товар» из трёх частей: имя, атрибуты с видимостью, операции.</desc><rect width="760" height="330" fill="#ffffff"/><rect x="60" y="50" width="280" height="220" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><rect x="60" y="50" width="280" height="44" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="200" y="79" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Товар</text><line x1="60" y1="94" x2="340" y2="94" stroke="#334155" stroke-width="1.6"/><text x="76" y="122" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">- артикул: String</text><text x="76" y="144" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">- название: String</text><text x="76" y="166" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">- цена: int</text><line x1="60" y1="178" x2="340" y2="178" stroke="#334155" stroke-width="1.6"/><text x="76" y="206" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">+ изменитьЦену(цена: int)</text><text x="76" y="230" font-size="14" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">+ вПродаже(): boolean</text><line x1="340" y1="72" x2="420" y2="72" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><text x="430" y="76" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#9a3412">1. Имя класса</text><line x1="340" y1="136" x2="420" y2="136" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><text x="430" y="140" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#9a3412">2. Атрибуты: данные класса</text><text x="430" y="157" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#9a3412">видимость: + открытый, − закрытый, # защищённый</text><line x1="340" y1="214" x2="420" y2="214" stroke="#9a3412" stroke-width="1.2" stroke-dasharray="4 3"/><text x="430" y="218" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#9a3412">3. Операции: поведение класса</text><text x="430" y="235" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#9a3412">имя(параметры): тип результата</text></svg>
