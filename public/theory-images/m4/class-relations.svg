<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Виды связей между классами</title><desc id="d">Ассоциация, агрегация, композиция, обобщение и зависимость на примерах магазина.</desc><rect width="760" height="520" fill="#ffffff"/><text x="20" y="34" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Ассоциация</text><text x="740" y="34" font-size="12" font-weight="normal" font-style="normal" text-anchor="end" fill="#9a3412">линия; на концах кратность</text><rect x="70" y="50" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="135.0" y="74" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Клиент</text><rect x="560" y="50" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="625.0" y="74" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Заказ</text><line x1="200" y1="69" x2="560" y2="69" stroke="#334155" stroke-width="1.6"/><text x="212" y="62" font-size="13" font-weight="bold" font-style="normal" text-anchor="start" fill="#0f172a">1</text><text x="548" y="62" font-size="13" font-weight="bold" font-style="normal" text-anchor="end" fill="#0f172a">0..*</text><text x="380" y="62" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">делает</text><text x="20" y="120" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Агрегация</text><text x="740" y="120" font-size="12" font-weight="normal" font-style="normal" text-anchor="end" fill="#9a3412">ромб у «целого», связь «целое — часть»</text><rect x="70" y="136" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="135.0" y="160" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Категория</text><rect x="560" y="136" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="625.0" y="160" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Товар</text><polygon points="200,155 214,147 228,155 214,163" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><line x1="228" y1="155" x2="560" y2="155" stroke="#334155" stroke-width="1.6"/><text x="380" y="148" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">объединяет</text><text x="20" y="206" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Композиция</text><text x="740" y="206" font-size="12" font-weight="normal" font-style="normal" text-anchor="end" fill="#9a3412">закрашенный ромб: часть не живёт без целого</text><rect x="70" y="222" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="135.0" y="246" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Заказ</text><rect x="560" y="222" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="625.0" y="246" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Позиция заказа</text><polygon points="200,241 214,233 228,241 214,249" fill="#334155" stroke="#334155" stroke-width="1.6"/><line x1="228" y1="241" x2="560" y2="241" stroke="#334155" stroke-width="1.6"/><text x="380" y="234" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">состоит из</text><text x="20" y="292" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Обобщение (наследование)</text><text x="740" y="292" font-size="12" font-weight="normal" font-style="normal" text-anchor="end" fill="#9a3412">пустой треугольник у «предка»</text><rect x="70" y="308" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="135.0" y="332" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Сотрудник</text><rect x="560" y="308" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="625.0" y="332" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Продавец</text><polygon points="200,327 218,318 218,336" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><line x1="218" y1="327" x2="560" y2="327" stroke="#334155" stroke-width="1.6"/><text x="380" y="320" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#0f172a">«Продавец» — разновидность «Сотрудника»</text><text x="20" y="378" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Зависимость</text><text x="740" y="378" font-size="12" font-weight="normal" font-style="normal" text-anchor="end" fill="#9a3412">пунктир со стрелкой: изменение одного влияет на другой</text><rect x="70" y="394" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="135.0" y="418" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Корзина</text><rect x="560" y="394" width="130" height="38" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="625.0" y="418" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Товар</text><line x1="200" y1="413" x2="546" y2="413" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="546" y1="413" x2="534" y2="406" stroke="#334155" stroke-width="1.6"/><line x1="546" y1="413" x2="534" y2="420" stroke="#334155" stroke-width="1.6"/><text x="380" y="406" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#0f172a">использует как параметр</text><text x="380" y="478" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">Классы и стрелки здесь учебные: кратность и ромбы нужны, чтобы читатель понял, зависит ли часть от целого</text></svg>
