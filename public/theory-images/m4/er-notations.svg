<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Одна связь в трёх нотациях</title><desc id="d">Связь «Клиент делает Заказ» в нотациях Чена, «воронья лапка» и UML.</desc><rect width="760" height="590" fill="#ffffff"/><text x="20" y="28" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Нотация Чена</text><rect x="70" y="70" width="140" height="50" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="140" y="101" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Клиент</text><polygon points="380,60 450,95 380,130 310,95" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="380" y="100" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">делает</text><rect x="550" y="70" width="140" height="50" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="620" y="101" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Заказ</text><line x1="210" y1="95" x2="310" y2="95" stroke="#334155" stroke-width="1.6"/><line x1="450" y1="95" x2="550" y2="95" stroke="#334155" stroke-width="1.6"/><text x="232" y="86" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9a3412">1</text><text x="528" y="86" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#9a3412">*</text><text x="380" y="160" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">прямоугольники — сущности, ромб — связь, кратность подписана на линиях</text><line x1="20" y1="180" x2="740" y2="180" stroke="#cbd5e1" stroke-width="1"/><text x="20" y="212" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Нотация «воронья лапка»</text><rect x="70" y="250" width="140" height="50" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="140" y="281" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Клиент</text><rect x="550" y="250" width="140" height="50" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="620" y="281" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Заказ</text><line x1="210" y1="275" x2="550" y2="275" stroke="#334155" stroke-width="1.6"/><line x1="221" y1="267" x2="221" y2="283" stroke="#334155" stroke-width="1.6"/><line x1="228" y1="267" x2="228" y2="283" stroke="#334155" stroke-width="1.6"/><line x1="534" y1="275" x2="550" y2="284" stroke="#334155" stroke-width="1.6"/><line x1="534" y1="275" x2="550" y2="275" stroke="#334155" stroke-width="1.6"/><line x1="534" y1="275" x2="550" y2="266" stroke="#334155" stroke-width="1.6"/><circle cx="523" cy="275" r="5" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="380" y="266" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">делает</text><text x="380" y="340" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#9a3412">связь — просто линия, кратность показана значками на концах</text><line x1="20" y1="360" x2="740" y2="360" stroke="#cbd5e1" stroke-width="1"/><text x="20" y="392" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1d4ed8">Нотация UML</text><rect x="70" y="420" width="140" height="78" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><rect x="70" y="420" width="140" height="28" rx="3" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="140.0" y="440" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#0f172a">Клиент</text><text x="80" y="463" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#0f172a">- id: int</text><text x="80" y="484" font