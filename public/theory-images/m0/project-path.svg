<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="t">Путь проекта от потребности до поддержки</title><desc id="d">Шесть этапов: потребность, требования, проектирование, реализация, сдача, поддержка; под каждым результаты работы аналитика и номера модулей курса.</desc><rect width="760" height="330" fill="#ffffff"/><text x="380" y="26" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Путь проекта: что делает аналитик и что получается на выходе</text><rect x="8" y="50" width="115" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="65.5" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Потребность</text><line x1="123" y1="73" x2="134" y2="73" stroke="#334155" stroke-width="1.8"/><polygon points="134,73 128,69 128,77" fill="#334155"/><line x1="65.5" y1="96" x2="65.5" y2="124" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="8" y="124" width="115" height="104" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><text x="65.5" y="143" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Результаты</text><text x="65.5" y="164" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Образ и границы</text><text x="65.5" y="182" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Лица и классы</text><text x="65.5" y="200" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">пользователей</text><text x="65.5" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">модуль 2</text><rect x="134" y="50" width="115" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="191.5" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Требования</text><line x1="249" y1="73" x2="260" y2="73" stroke="#334155" stroke-width="1.8"/><polygon points="260,73 254,69 254,77" fill="#334155"/><line x1="191.5" y1="96" x2="191.5" y2="124" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="134" y="124" width="115" height="104" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><text x="191.5" y="143" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Результаты</text><text x="191.5" y="164" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Требования</text><text x="191.5" y="182" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Истории, модели</text><text x="191.5" y="200" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Прототип</text><text x="191.5" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">модули 2, 4–7</text><rect x="260" y="50" width="115" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="317.5" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Проектирование</text><line x1="375" y1="73" x2="386" y2="73" stroke="#334155" stroke-width="1.8"/><polygon points="386,73 380,69 380,77" fill="#334155"/><line x1="317.5" y1="96" x2="317.5" y2="124" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="260" y="124" width="115" height="104" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><text x="317.5" y="143" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Результаты</text><text x="317.5" y="164" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Архитектура</text><text x="317.5" y="182" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Спецификация API</text><text x="317.5" y="200" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Диаграммы</text><text x="317.5" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">модули 8, 9, 12</text><rect x="386" y="50" width="115" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="443.5" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Реализация</text><line x1="501" y1="73" x2="512" y2="73" stroke="#334155" stroke-width="1.8"/><polygon points="512,73 506,69 506,77" fill="#334155"/><line x1="443.5" y1="96" x2="443.5" y2="124" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="386" y="124" width="115" height="104" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><text x="443.5" y="143" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Результаты</text><text x="443.5" y="164" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Тест-кейсы</text><text x="443.5" y="182" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Матрица</text><text x="443.5" y="200" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">трассируемости</text><text x="443.5" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">модуль 10</text><rect x="512" y="50" width="115" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="569.5" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Сдача</text><line x1="627" y1="73" x2="638" y2="73" stroke="#334155" stroke-width="1.8"/><polygon points="638,73 632,69 632,77" fill="#334155"/><line x1="569.5" y1="96" x2="569.5" y2="124" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="512" y="124" width="115" height="104" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><text x="569.5" y="143" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Результаты</text><text x="569.5" y="164" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">ПМИ, протокол</text><text x="569.5" y="182" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Ру